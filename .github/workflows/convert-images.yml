name: Convert PNG to WebP

on:
  workflow_dispatch:
  push:
    paths:
      - 'public/backgrounds/*.png'

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install sharp
        run: npm install sharp

      - name: Convert images
        run: |
          node -e "
          const sharp = require('sharp');
          const fs = require('fs');
          const path = './public/backgrounds';

          fs.readdirSync(path).forEach(file => {
            if (file.endsWith('.png')) || file.endsWith('.PNG')) {
              const input = path + '/' + file;
              const output = path + '/' + file.replace('.png', '.webp');

              sharp(input)
                .resize({ height: 1400 })
                .webp({ quality: 65 })
                .toFile(output)
                .then(() => console.log('Converted:', file))
                .catch(err => console.error(err));
            }
          });
          "

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Auto convert images to webp" || echo "No changes"
          git push
